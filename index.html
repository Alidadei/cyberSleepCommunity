<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="赛博睡眠社区 cyberSleep——一个专门收录让人犯困内容的打分网站，数据联通「睡眠站台」APP。无广告 · 无追踪 · 无账号。">
<title>赛博睡眠社区 cyberSleep · 犯困内容收藏馆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  /* 时辰主题：夜=藕荷紫夜（站主 2026-09-10 配色图：藕荷紫 #B89BBF × 月砂灰 #DDD2CB）
     昼=琥珀棕 #8E705F × 雾杏粉 #E9D2C7（站主 2026-09-10 第二张配色图）。
     :root 存夜色为默认；昼色与渐变由 <head> 内主题脚本按本地时间插值写入（5–8 点渐亮、17–20 点渐暗）。
     层级三级：页面底 → 卡片亮一级 → 输入框暗一级。 */
  :root{--bg:#1c1626;--card:#272033;--input:#1e1829;--line:#403652;--ink:#ece4e1;--sub:#a897b0;--accent:#b89bbf;--act:#7d6199;--ok:#a5c9ae;--bad:#d98f8f;
    --accent2:#dcc3e2;--link:#c9b3d6;--nodeorb-rgb:255,255,255;
    --ink-rgb:236,228,225;--sub-rgb:168,151,176;--accent-rgb:184,155,191;--t:0}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font:16px/1.8 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;padding:56px 0 36px}
  /* 整页固定天空：夜=2D 星空画布，昼=个人站同款暖渐变；内容卡有实底，不受影响 */
  .page-sky{position:fixed;inset:0;z-index:0;pointer-events:none}
  #skyStars{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:calc(1 - var(--t))}
  .sky-day{position:absolute;inset:0;opacity:var(--t);
    background:
      radial-gradient(circle 340px at 80% 8%, rgba(255,244,214,.95), rgba(255,228,160,.35) 45%, transparent 72%),
      linear-gradient(180deg,#f5e6d3 0%,#f0d4c0 25%,#e8c8d8 55%,#d4c0e8 80%,#cfc5ec 100%)}
  /* 一盏暖灯：页顶极淡光晕（氛围元素，透明度 ≤0.06） */
  body::after{content:"";position:fixed;left:50%;top:-140px;width:640px;height:340px;transform:translateX(-50%);z-index:0;pointer-events:none;
    background:radial-gradient(closest-side, rgb(var(--accent-rgb)/.05), transparent 72%)}
  .wrap{max-width:860px;margin:0 auto;position:relative;z-index:1;padding:0 14px}
  /* 手写体：入场信与问候（装饰字体至多一个，CDN+swap，失败回退系统楷体） */
  .hand{font-family:'Ma Shan Zheng','Kaiti SC','STKaiti','KaiTi',serif;letter-spacing:.05em}
  /* 品牌区：坐在整页天空之上（天空已改为整页固定背景） */
  .brand{position:relative;z-index:1;text-align:center;padding:34px 0 12px}
  /* 品牌图标：夜月昼日，随 --t 交叉淡化 */
  .bicon{display:inline-block;position:relative;width:26px;height:26px;vertical-align:-5px;margin-right:8px}
  .bicon svg{position:absolute;inset:0;width:26px;height:26px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:opacity 1.5s}
  .bicon .i-moon{opacity:calc(1 - var(--t))}
  .bicon .i-sun{opacity:var(--t)}
  h1{font-size:34px;color:var(--accent);font-weight:400;letter-spacing:.04em;line-height:1.4}
  .hand{font-family:'Ma Shan Zheng','Kaiti SC','STKaiti','KaiTi',serif;letter-spacing:.05em}
  .brand-line{width:48px;height:3px;border-radius:2px;margin:12px auto 0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .sub{color:var(--sub);font-size:15px;margin-top:10px}
  .sub.hand{font-size:17px}
  .greet{color:var(--sub);font-size:15px;margin-top:6px}
  /* 全屏入场：站主手写信逐字打出（手写体；限时兜底、可跳过、reduced-motion 直接跳过） */
  #intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;cursor:pointer;transition:opacity .8s ease}
  #intro.bye{opacity:0;pointer-events:none}
  .intro-paper{max-width:620px;color:var(--ink)}
  .intro-text{font-size:20px;line-height:2.1;text-align:justify;white-space:pre-wrap;min-height:10em}
  .intro-text::after{content:"▍";color:var(--accent);animation:introCaret 1.1s step-end infinite}
  .intro-text.done::after{content:""}
  .intro-sign{margin-top:16px;text-align:right;font-size:17px;opacity:0;transition:opacity .8s}
  .intro-sign.show{opacity:.85}
  .intro-hint{position:absolute;bottom:26px;font-size:12px;color:var(--sub);letter-spacing:.1em}
  @keyframes introCaret{50%{opacity:0}}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}
  .chip{background:none;border:none;color:var(--sub);font-size:14px;cursor:pointer;user-select:none;font-family:inherit;padding:4px 6px;transition:color .2s}
  .chip:hover{color:var(--ink)}
  .chip.on{color:var(--accent)}
  /* 整卡可点：标题锚点 ::after 覆盖卡片；评分入口/星星行 position:relative 保持可点 */
  .card{position:relative;cursor:pointer;background:var(--card);border:none;border-radius:14px;padding:14px 16px;margin:10px 0;transition:background-color .2s}
  .card:hover{background:rgb(var(--card-rgb)/.92)}
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)){
    .card{background:rgb(var(--card-rgb)/.4);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);border:1px solid rgb(var(--accent-rgb)/.12)}
    .card:hover{background:rgb(var(--card-rgb)/.55);border-color:rgb(var(--accent-rgb)/.25)}
  }
  .card:hover .t{color:var(--accent)}
  .card .head{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
  /* ranking：低调 mono 序号，第 1 名金灯点亮（站主要求 2026-09-10，替代「无名次」原案） */
  .card .rank{flex-shrink:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:22px;font-weight:700;color:var(--sub);line-height:1}
  .card .rank.top{color:var(--accent)}
  .card .t{min-width:0;font-size:17px;font-weight:600;color:var(--ink);text-decoration:none;overflow-wrap:anywhere;transition:color .2s}
  .card .t::after{content:"";position:absolute;inset:0}
  .card .m{font-size:13px;color:var(--sub);margin-top:4px;word-break:break-all;overflow-wrap:anywhere;text-align:center}
  .star-mark{color:var(--accent);margin-right:2px}
  .card .rate{position:relative;flex-shrink:0;font-size:13px;color:var(--accent);cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:12px;padding:2px 12px;font-family:inherit;transition:border-color .2s}
  .card .rate:hover{border-color:var(--accent)}
  .card .rate[aria-expanded="true"]{border-color:var(--accent)}
  .type{display:inline-block;font-size:12px;color:var(--accent);margin-right:8px}
  .twin{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:0 8px;margin-left:8px;vertical-align:baseline}
  .twin svg{flex-shrink:0}
  /* 星星打分控件（全站图腾）：hover/focus 逐颗预览，点击即提交 */
  .stars{position:relative;display:none;align-items:center;gap:2px;margin-top:8px}
  .stars.open{display:flex;justify-content:center}
  .star{background:none;border:none;padding:3px;cursor:pointer;line-height:0;border-radius:4px}
  .star svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round;transition:fill .15s}
  .star.on svg{fill:var(--accent)}
  .stars .done{color:var(--ok);font-size:13px;margin-left:6px}
  .stars .oops{color:var(--bad);font-size:13px;margin-left:6px}
  .form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:22px 0}
  .form h3{color:var(--accent);font-size:16px;margin-bottom:10px}
  input,select{width:100%;background:var(--input);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 12px;font-size:14px;margin:6px 0;outline:none;font-family:inherit;transition:border-color .2s}
  input::placeholder{color:rgb(var(--sub-rgb)/.55)}
  input:focus,select:focus{border-color:var(--act)}
  .btn{background:var(--act);color:#fff;border:none;border-radius:10px;padding:9px 26px;font-size:15px;cursor:pointer;margin-top:8px;font-family:inherit;transition:filter .2s}
  .btn:hover{filter:brightness(1.15)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
  .btn.ghost:hover{color:var(--ink);border-color:var(--act)}
  .msg{font-size:13px;margin-top:8px;display:none}
  .msg.ok{display:block;color:var(--ok)} .msg.bad{display:block;color:var(--bad)}
  .label{font-size:13px;color:var(--sub)}
  #list{max-width:440px;margin:0 auto}
  /* 固定导航栏：不随页面滚动消失 */
  .nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;gap:26px;justify-content:flex-end;align-items:center;margin:0;padding:9px 16px;background:rgb(var(--bg-rgb)/.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex-wrap:wrap}
  /* 类型星图：散落节点（夜=星星，昼=光点），点击展开对应药方 */
  .nodes{position:relative;height:clamp(280px,40vh,420px);margin-top:-30px}
  .node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:8px;min-width:64px}
  .node-orb{width:9px;height:9px;border-radius:50%;background:rgb(var(--nodeorb-rgb));box-shadow:0 0 14px 4px rgb(var(--accent-rgb)/.55);transition:box-shadow .3s,transform .3s,background-color .3s}
  .node.on .node-orb{transform:scale(1.45);box-shadow:0 0 20px 7px rgb(var(--accent-rgb)/.8)}
  .node-label{font-size:13px;color:var(--sub);transition:color .2s;white-space:nowrap}
  .node.on .node-label{color:var(--accent)}
  .node:hover .node-label{color:var(--accent)}
  /* 失眠原因搜索：隐形搜索框，手写体提示字，绝对居中于标签星图中央 */
  .search{display:block;width:min(320px,60%);margin:0 auto 18px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:none;border-radius:0;color:var(--ink);padding:12px 0;font-family:'Ma Shan Zheng','Kaiti SC','STKaiti','KaiTi',serif;font-size:20px;text-align:center;outline:none;transition:opacity .3s}
  .search::placeholder{color:rgb(var(--sub-rgb)/.45);font-family:'Ma Shan Zheng','Kaiti SC','STKaiti','KaiTi',serif;font-size:20px;letter-spacing:.04em}
  .search:focus{opacity:1}
  .nodes .search{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;margin:0}
  @media (max-width:640px){
    .hamburger{display:block}
    .nav{display:none;position:fixed;top:52px;left:0;right:0;z-index:30;flex-direction:column;gap:8px;padding:12px 16px;background:rgb(var(--bg-rgb)/.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);align-items:flex-start}
    .nav.open{display:flex}
    .navitem{font-size:16px;padding:6px 0}
    .nodes{height:280px;margin-top:-10px}
    .nodes .search{width:min(240px,70%);font-size:17px}
    .nodes .search::placeholder{font-size:17px}
    .node{min-width:56px}
    .node-label{font-size:12px}
    input,select{font-size:16px}
    .form{padding:14px}
    .card{padding:12px 14px}
    #list{max-width:100%}
    .ranking-overlay{padding:56px 10px 24px}
    .ranking-header{flex-wrap:wrap}
  }
  .navitem{background:none;border:none;font-family:inherit;font-size:16px;color:var(--sub);cursor:pointer;padding:4px 2px;transition:color .2s}
  .navitem:hover{color:var(--accent)}
  .navitem[aria-expanded="true"]{color:var(--accent)}
  /* 手书灯箱：站长手书原稿 */
  .lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .lightbox.open{display:flex}
  .lightbox figure{margin:0;cursor:default}
  .lightbox img{display:block;max-width:min(680px,94vw);max-height:82vh;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .lightbox figcaption{text-align:center;font-size:12px;color:var(--sub);margin-top:10px}
  .panel{position:fixed;top:52px;right:16px;z-index:20;width:min(420px,calc(100vw - 32px));overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;max-height:0;opacity:0;padding:0 18px;visibility:hidden;transition:max-height .3s ease-in-out,opacity .3s ease-in-out,padding .3s ease-in-out,visibility .3s}
  .panel.open{max-height:calc(100vh - 90px);opacity:1;padding:18px;visibility:visible}
  .toast{position:fixed;top:16px;right:16px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 14px;max-width:calc(100vw - 32px)}
  .hint{font-size:12px;color:var(--sub);text-align:center;margin-top:6px}
  footer{margin-top:96px;padding-top:18px;border-top:1px dashed rgb(var(--accent-rgb)/.3);text-align:center;color:var(--sub);font-size:12px;line-height:2}
  footer a{color:var(--link)}
  .focusable:focus-visible{outline:2px solid var(--act);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none!important;animation:none!important}
  }
  /* 失眠标签缓慢闪烁亮点（昼夜颜色不一） */
  @keyframes nodePulseNight{
    0%,100%{box-shadow:0 0 10px 3px rgba(255,255,255,.25);opacity:.6}
    50%{box-shadow:0 0 22px 8px rgba(184,155,191,.6);opacity:1}
  }
  @keyframes nodePulseDay{
    0%,100%{box-shadow:0 0 10px 3px rgba(255,196,110,.25);opacity:.6}
    50%{box-shadow:0 0 22px 8px rgba(122,90,69,.6);opacity:1}
  }
  .node:not(.on) .node-orb{animation:nodePulseNight 4s ease-in-out infinite}
  .node:not(.on) .node-orb{animation:nodePulseNight calc(4s - var(--t) * 1s) ease-in-out infinite}
  .node.on .node-orb{animation:none;transform:scale(1.45);box-shadow:0 0 20px 7px rgb(var(--accent-rgb)/.8);opacity:1}
  /* 汉堡按钮（移动端显示） */
  .hamburger{display:none;position:fixed;top:10px;left:16px;z-index:31;background:none;border:none;color:var(--sub);cursor:pointer;padding:4px;line-height:0;transition:color .2s}
  .hamburger:hover{color:var(--accent)}
  .hamburger.open svg line:nth-child(1){transform:rotate(45deg);transform-origin:12px 6px}
  .hamburger svg line{transition:transform .3s ease}
  .hamburger.open svg line:nth-child(2){opacity:0}
  .hamburger.open svg line:nth-child(3){transform:rotate(-45deg);transform-origin:12px 18px}
  /* 全屏排行榜覆盖层 */
  .ranking-overlay{position:fixed;inset:0;z-index:25;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;padding:56px 14px 36px}
  .ranking-overlay.open{display:flex}
  .ranking-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-shrink:0}
  .ranking-back{background:none;border:1px solid var(--line);border-radius:10px;color:var(--sub);font-size:14px;padding:6px 14px;cursor:pointer;font-family:inherit;transition:border-color .2s,color .2s;flex-shrink:0}
  .ranking-back:hover{border-color:var(--accent);color:var(--accent)}
  .ranking-type-badge{font-size:14px;color:var(--accent);font-weight:600}
  .ranking-overlay .search{margin-bottom:14px;background:rgb(var(--card-rgb)/.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);font-family:inherit;font-size:14px;text-align:left;padding:9px 12px}
  .ranking-overlay .search::placeholder{font-family:inherit;font-size:14px;letter-spacing:normal}
  .ranking-list{flex:1;position:relative}
  .ranking-list .card{margin:8px 0}
</style>
<script>
/* 时辰主题：按本地时间在夜/昼两套色板间连续插值。
   夜=藕荷紫夜（--t:0），昼=琥珀棕×雾杏粉（--t:1）；5–8 点渐亮、17–20 点渐暗。
   放在 <head>：先于正文算好颜色，避免日夜闪跳。调试可用 ?day=1 / ?day=0 强制。 */
(function(){
  const NIGHT={bg:[28,22,38],card:[39,32,51],input:[30,24,41],line:[64,54,82],ink:[236,228,225],sub:[168,151,176],accent:[184,155,191],act:[125,97,153],ok:[165,201,174],bad:[217,143,143],accent2:[220,195,226],link:[201,179,214],nodeorb:[255,255,255]};
  const DAY={bg:[244,235,228],card:[236,225,216],input:[250,245,240],line:[217,200,188],ink:[80,59,44],sub:[94,75,59],accent:[122,90,69],act:[109,83,66],ok:[95,138,82],bad:[179,90,74],accent2:[224,191,174],link:[138,95,58],nodeorb:[255,196,110]};
  const smooth=t=>t*t*(3-2*t);
  let forced=null;
  try{const q=new URLSearchParams(location.search).get('day');if(q!==null)forced=q==='1'?1:0;}catch(e){}
  function dayT(){
    if(forced!==null)return forced;
    const h=new Date().getHours()+new Date().getMinutes()/60;
    if(h>=8&&h<17)return 1;
    if(h>=5&&h<8)return smooth((h-5)/3);
    if(h>=17&&h<20)return 1-smooth((h-17)/3);
    return 0;
  }
  function apply(){
    const t=dayT(),s=document.documentElement.style;
    for(const k of Object.keys(NIGHT)){
      const c=NIGHT[k].map((n,i)=>Math.round(n+(DAY[k][i]-n)*t));
      s.setProperty('--'+k,'#'+c.map(n=>n.toString(16).padStart(2,'0')).join(''));
      if(k==='ink'||k==='sub'||k==='accent'||k==='bg'||k==='nodeorb')s.setProperty('--'+k+'-rgb',c.join(','));
    }
    s.setProperty('--t',t.toFixed(3));
    window.__dayT=t;
  }
  apply();
  window.__themeTick=apply;
})();
</script>
</head>
<body>

<div class="page-sky" aria-hidden="true">
  <canvas id="skyStars"></canvas>
  <div class="sky-day"></div>
</div>

<div id="intro" aria-label="站长的话">
  <div class="intro-paper">
    <div class="hand intro-text" id="introText"></div>
    <div class="hand intro-sign" id="introSign">—— 上海 2026.9.10. 1:49</div>
  </div>
  <div class="intro-hint" id="introHint">轻触任意处继续</div>
</div>

<div class="wrap">
<nav class="nav" id="mainNav" aria-label="Site navigation">
  <button class="navitem focusable" id="navLang" aria-label="Switch language">EN</button>
  <button class="navitem focusable" id="navPublish" aria-expanded="false" aria-controls="formPanel">推荐药方</button>
  <!-- 网站介绍入口暂时隐藏（playIntro 重播逻辑保留，恢复时取消注释即可）
  <button class="navitem focusable" id="navAbout">网站介绍</button>
  -->
  <button class="navitem focusable" id="navExport">导出</button>
  <button class="navitem focusable" id="navImport">导入</button>
  <button class="navitem focusable" id="navLetter" aria-haspopup="dialog">手书</button>
</nav>
<button class="hamburger focusable" id="hamburgerBtn" aria-label="Toggle menu" aria-expanded="false">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

  <header class="brand">

/* ================= AdGuard（词表来源 docs/adguard-rules.json，与 APP AdGuard.kt 同步） ================= */
const ADGUARD = (() => {
  const strong = ["加微信","加vx","加V","加企鹅","私聊","私信我","联系我","扫码","二维码","优惠券","领券","折扣","低价出","出售","急出","二手转","代购","代下单","下单立减","货到付款","返现","佣金","招商","招代理","兼职","刷单","引流","涨粉","粉丝群","资源群","内部群","免费领","点击购买","立即购买","店铺","旗舰店","微店","拼多多","淘宝下单","京东自营店","带货","卖货","招聘","贷款","借款","办理","低价充值","会员充值","账号出售","外挂"];
  const weak = ["广告","推广","下单","购买","秒杀","限时","福利","补贴","开户","咨询","官网址","平台","一手货源","厂家直销","包赚","稳赚","收益"];
  const contact = [
    /(微信|weixin|wx|vx|v信|v:x|威信|薇信)[号:：\s]*[a-zA-Z0-9_-]{5,}/i,
    /(qq|扣扣|企鹅)[群号:：\s]*\d{4,}/i,
    /1[3-9]\d{9}/,
    /(t\.cn|bit\.ly|dwz\.cn|url\.cn|suo\.im|tinyurl)\/\S+/i
  ];
  function check(text) {
    const s = (text || '').toLowerCase();
    for (const re of contact) { const m = re.exec(s); if (m) return {ok:false, code:'ad_contact', param:m[0].slice(0,24)}; }
    for (const k of strong) if (s.includes(k.toLowerCase())) return {ok:false, code:'ad_strong', param:k};
    const weakHits = weak.filter(k => s.includes(k.toLowerCase())).length;
    if (weakHits >= 2) return {ok:false, code:'ad_weak', param:weakHits};
    return {ok:true};
  }
  return {check};
})();

/* ================= 存储层：LocalStore（默认） / SupabaseStore（P1 配置后启用）
   两套实现同异步接口：load / save / add / rate，UI 层无感切换 ================= */
const LocalStore = {
  async load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
  },
  async save(picks) {
    localStorage.setItem(KEY, JSON.stringify(picks));
  },
  async add(title, url, type) {
    const picks = await this.load();
    picks.push({ id: Date.now(), title, url, type: type || null, ratings: [], addedAt: Date.now() });
    await this.save(picks);
  },
  async rate(id, score) {
    const picks = await this.load();
    const p = picks.find(x => x.id === id);
    if (p) { (p.ratings = p.ratings || []).push(score); await this.save(picks); }
  }
};

const SupabaseStore = {
  base: (SUPABASE.url || '').replace(/\/+$/, ''),
  headers() {
    return { apikey: SUPABASE.anonKey, Authorization: 'Bearer ' + SUPABASE.anonKey, 'Content-Type': 'application/json' };
  },
  async load() {
    const r = await fetch(this.base + '/rest/v1/community_picks?select=id,title,url,type,ratings,addedAt&order=addedAt.desc&limit=1000', {headers: this.headers()});
    if (!r.ok) throw new Error('load ' + r.status);
    return r.json();
  },
  /* 导入合并用：按主键 upsert 整批 */
  async save(picks) {
    if (!picks.length) return;
    const r = await fetch(this.base + '/rest/v1/community_picks', {
      method: 'POST',
      headers: Object.assign({Prefer: 'resolution=merge-duplicates'}, this.headers()),
      body: JSON.stringify(picks)
    });
    if (!r.ok) throw new Error('save ' + r.status);
  },
  async add(title, url, type) {
    const row = { id: Date.now(), title, url, type: type || null, ratings: [], addedAt: Date.now() };
    const r = await fetch(this.base + '/rest/v1/community_picks', {method: 'POST', headers: this.headers(), body: JSON.stringify(row)});
    if (!r.ok) throw new Error('add ' + r.status);
  },
  /* 打分 = 读回 ratings 数组，追加后整体 PATCH（契约 §6 的既定做法，接受并发覆盖） */
  async rate(id, score) {
    const g = await fetch(this.base + '/rest/v1/community_picks?id=eq.' + id + '&select=ratings', {headers: this.headers()});
    if (!g.ok) throw new Error('rate read ' + g.status);
    const rows = await g.json();
    if (!rows.length) throw new Error('not found');
    const ratings = (rows[0].ratings || []).concat(score);
    const r = await fetch(this.base + '/rest/v1/community_picks?id=eq.' + id, {
      method: 'PATCH', headers: this.headers(), body: JSON.stringify({ratings})
    });
    if (!r.ok) throw new Error('rate write ' + r.status);
  }
};

const Store = (SUPABASE.url && SUPABASE.anonKey) ? SupabaseStore : LocalStore;

/* ================= 工具 ================= */
function normalizeUrl(u) {
  u = (u || '').trim();
  return /^(https?:\/\/)/i.test(u) ? u : 'https://' + u;
}
function isValidUrl(u) {
  try { return !!new URL(normalizeUrl(u)).host; } catch (e) { return false; }
}
/* 去重键：协议无关、host 去 www、去尾斜杠 */
function urlKey(u) {
  try {
    const x = new URL(normalizeUrl(u));
    return x.host.replace(/^www\./, '') + x.pathname.replace(/\/+$/, '') + x.search;
  } catch (e) { return (u || '').trim().toLowerCase(); }
}
function hostOf(u) {
  try { return new URL(normalizeUrl(u)).host.replace(/^www\./, ''); } catch (e) { return u || ''; }
}
/* 链接解析：与 APP LinkParser.parse 同款——四种书名号取标题 + URL 尾部标点修剪 */
const TITLE_RES = [/【(.+?)】/, /「(.+?)」/, /『(.+?)』/, /《(.+?)》/];
function parseShareText(text) {
  const m = (text || '').match(/https?:\/\/\S+/);
  const url = m && m[0].replace(/[，。）)\]】,;"]+$/, '');
  let title = null;
  for (const re of TITLE_RES) {
    const t = (text || '').match(re);
    if (t) { title = t[1]; break; }
  }
  return { url, title: title ? title.trim() : null };
}
/* 标题抓取：与 APP LinkParser.fetchTitleAsync 同意图。网页端受 CORS 限制：
   B 站链接走 B 站开放 API，其余站点尝试直连读 <title>；
   只访问链接所属平台本身、不经第三方代理（无追踪红线），失败静默回退域名标题 */
const TITLE_SUFFIXES = ['_哔哩哔哩_bilibili','_哔哩哔哩','_bilibili',' - YouTube','_高清1080P在线观看平台','- 虎牙直播',' - 腾讯视频','_爱奇艺',' - 知乎'];
function cleanTitle(t) {
  if (!t) return null;
  let c = String(t).replace(/<[^>]*>/g, '')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&nbsp;/g, ' ')
    .trim();
  for (const s of TITLE_SUFFIXES) {
    if (c.toLowerCase().endsWith(s.toLowerCase())) { c = c.slice(0, -s.length).trim(); break; }
  }
  c = c.trim();
  return c ? c.slice(0, 80) : null;
}
/* 标题抓取：与 APP LinkParser.fetchTitleAsync 同意图。网页端受 CORS 限制：
   B 站 API 无 CORS 头 → 走 JSONP；其余站点尝试直连读 <title>，CORS 不放行即静默失败。
   只访问链接所属平台本身、不经第三方代理（无追踪红线），失败回退域名标题 */
function jsonp(api) {
  return new Promise((resolve, reject) => {
    const fn = 'cscTitleCb' + Date.now();
    const s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('jsonp timeout')); }, 5000);
    function done() {
      clearTimeout(timer);
      try { delete window[fn]; } catch (e) { window[fn] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[fn] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('jsonp error')); };
    s.src = api + '&jsonp=jsonp&callback=' + fn;
    document.head.appendChild(s);
  });
}
function fetchTitleAsync(url, onResult) {
  const job = (async () => {
    const bv = url.match(/bilibili\.com\/video\/(BV[0-9A-Za-z]+)/i);
    const av = url.match(/bilibili\.com\/video\/av(\d+)/i);
    if (bv || av) {
      const api = bv ? 'https://api.bilibili.com/x/web-interface/view?bvid=' + bv[1]
                     : 'https://api.bilibili.com/x/web-interface/view?aid=' + av[1];
      const j = await jsonp(api);
      return (j && j.code === 0 && j.data && j.data.title) ? cleanTitle(j.data.title) : null;
    }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    try {
      const r = await fetch(url, {signal: ctrl.signal});
      const m = (await r.text()).slice(0, 80000).match(/<title[^>]*>([\s\S]*?)<\/title>/i);
      return m ? cleanTitle(m[1]) : null;
    } finally { clearTimeout(timer); }
  })();
  job.then(t => onResult(t)).catch(() => onResult(null));
}
function typeLabel(key) { const b = TYPES.find(x => x.key === key); return b ? t('type_' + key) : (key || ''); }
/* 类型标签可添加：内置四类归一为 key，自定义标签原样入库（≤12 字，会一并过 AdGuard） */
function normalizeTag(v) {
  v = (v || '').trim().slice(0, 12);

}

/* 排序契约 §3：平均分降序 → 评分数降序 → addedAt 降序。
   内置样例用示例评分（sampleRatingAvg/Count）参与同榜排序，真实数据接入后自然被顶下去 */
function avgOf(p) {
  if (Array.isArray(p.ratings)) return p.ratings.length ? p.ratings.reduce((x,y)=>x+y,0)/p.ratings.length : -1;
  return p.sampleRatingAvg != null ? p.sampleRatingAvg : -1;
}
function countOf(p) {
  return Array.isArray(p.ratings) ? p.ratings.length : (p.sampleRatingCount || 0);
}
function sortPicks(items) {
  return items.slice().sort((a,b) =>
    avgOf(b) - avgOf(a) || countOf(b) - countOf(a) || (b.addedAt||0) - (a.addedAt||0));
}
/* 导入行的合规化：字段/类型不符合契约 §1 的条目直接丢弃 */
function coercePick(o) {
  if (!o || typeof o !== 'object') return null;
  const title = typeof o.title === 'string' ? o.title.trim().slice(0, 80) : '';
  const url = isValidUrl(o.url) ? normalizeUrl(o.url) : '';
  if (!title || !url) return null;
  const id = Number.isFinite(o.id) ? Math.trunc(o.id) : Date.now();
  const ratings = Array.isArray(o.ratings)
    ? o.ratings.map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= 5) : [];
  const addedAt = Number.isFinite(o.addedAt) ? Math.trunc(o.addedAt) : id;
  const type = TYPES.some(t => t.key === o.type) ? o.type : null;
  return {id, title, url, type, ratings, addedAt};
}
function findDup(url) {
  const k = urlKey(url);
  return BUILTIN.find(p => urlKey(p.url) === k)
      || allPicks.find(p => urlKey(p.url) === k)
      || null;
}
/* 样例打分模拟：存独立本地键，与契约数据（csc_community_picks）互不污染 */
function sampleRatings() {
  try {
    const o = JSON.parse(localStorage.getItem(SKEY));
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  } catch (e) { return {}; }
}
function addSampleRating(url, score) {
  const o = sampleRatings();
  const k = urlKey(url);
  const arr = Array.isArray(o[k]) ? o[k] : [];
  arr.push(score);
  o[k] = arr.slice(-50);
  localStorage.setItem(SKEY, JSON.stringify(o));
}

    const ox = (seed - 5) * 1.2;
    const oy = ((seed * 3 + 1) % 11 - 5) * 1.1;
    const x = Math.min(92, Math.max(4, pos[0] + ox + (i >= NODE_SLOTS.length ? 8 : 0)));
    const y = Math.min(90, Math.max(6, pos[1] + oy + (i >= NODE_SLOTS.length ? 18 : 0)));
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'node focusable';
    b.style.left = x + '%';
    b.style.top = y + '%';
    b.setAttribute('aria-pressed', 'false');
    const orb = document.createElement('span');
    orb.className = 'node-orb'; orb.setAttribute('aria-hidden', 'true');
    const lb = document.createElement('span');
    lb.className = 'node-label';
    lb.textContent = label;
    b.appendChild(orb); b.appendChild(lb);
    b.onclick = () => {
      closeHamburger();
      showRankingPage(key);
    };
    box.appendChild(b);
  });
}

        const count = b.sampleRatingCount + mine.length;
        const avg = mine.length
          ? (b.sampleRatingAvg * b.sampleRatingCount + mine.reduce((a,c)=>a+c,0)) / count
          : b.sampleRatingAvg;
        return { title:b.title, url:b.url, type:b.type, sample:true, sampleRatingAvg:avg, sampleRatingCount:count };
      }),
      ...allPicks
    ];
    let items;
    if (typeKey === 'all') {
      items = sortPicks(pool);
    } else if (typeKey === 'none') {
      items = sortPicks(pool.filter(p => p.type == null || p.type === ''));
    } else {
      items = sortPicks(pool.filter(p => p.type === typeKey));

  }

function searchScore(p, qL) {
  let score = 0;
  const title = (p.title || '').toLowerCase();
  if (title.includes(qL)) score += 3;
  const tl = typeLabel(p.type).toLowerCase();
  if (tl && tl.includes(qL)) score += 2;
  const rk = REASON_KEYS[p.type];
  if (rk && rk.some(k => k.includes(qL) || qL.includes(k))) score += 2;
  return score;
}
function cardFor(it, rank) {
  return it.sample
    ? card(it.title, it.url, it.type, null, false, it, rank)
    : card(it.title, it.url, it.type, it, true, null, rank);
}
function renderList() {
  const list = document.getElementById('list');
  [...list.querySelectorAll('.card, .empty')].forEach(n => n.remove());
  const q = (searchQ || '').trim().toLowerCase();
  const userSample = sampleRatings();   /* 访客对样例的模拟评分，并入示例聚合值 */
  const pool = [
    ...BUILTIN.map(b => {
      const mine = userSample[urlKey(b.url)] || [];
      const count = b.sampleRatingCount + mine.length;
      const avg = mine.length
        ? (b.sampleRatingAvg * b.sampleRatingCount + mine.reduce((a,c)=>a+c,0)) / count
        : b.sampleRatingAvg;
      return { title:b.title, url:b.url, type:b.type, sample:true, sampleRatingAvg:avg, sampleRatingCount:count };
    }),
    ...allPicks
  ];
  if (q) {
    const scored = pool.map(p => [searchScore(p, q), p]).filter(x => x[0] > 0)
      .sort((a,b) => b[0]-a[0] || avgOf(b[1])-avgOf(a[1]));
    const head = document.createElement('div');
    head.className = 'hint'; head.style.margin = '18px 0';
    head.textContent = scored.length ? t('search_found')(scored.length, searchQ.trim()) : t('search_none')(searchQ.trim());
    list.appendChild(head);
    scored.forEach(([sc, p], i) => list.appendChild(cardFor(p, String(i+1).padStart(2,'0'))));
    if (!scored.length) {
      const tip = document.createElement('div');
      tip.className = 'hint'; tip.style.margin = '20px 0';
      tip.textContent = t('search_tip');
      list.appendChild(tip);
    }
    return;
  }
  if (!currentType) {
    return;
  }
  const typeOk = p => currentType === 'none' ? (p.type == null || p.type === '') : p.type === currentType;
  const items = sortPicks(pool.filter(typeOk));
  items.forEach((p, i) => list.appendChild(cardFor(p, String(i+1).padStart(2,'0'))));
  if (!items.some(p => !p.sample)) {
    const empty = document.createElement('div');
    empty.className = 'hint empty';
    empty.style.margin = '20px 0';
    empty.textContent = t('empty_type');
    list.appendChild(empty);
  }
}

function card(title, url, type, pick, isCommunity, builtin, rank) {
  const el = document.createElement('div');
  el.className = 'card';

  const head = document.createElement('div');
  head.className = 'head';
  const rankEl = document.createElement('span');
  rankEl.className = 'rank' + (rank === '01' ? ' top' : '');
  rankEl.textContent = rank;
  rankEl.setAttribute('aria-hidden', 'true');
  head.appendChild(rankEl);
  const a = document.createElement('a');
  a.className = 't';
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.textContent = (builtin && builtin.sample ? t('sample_tag') : '') + title;
  head.appendChild(a);

  /* 可评分对象：社区条目走 Store，样例走本地模拟（样例评分并入示例聚合值） */
  const subject = isCommunity && pick ? pick : (builtin ? {sample: true, url} : null);
  const rateId = isCommunity && pick ? String(pick.id) : 's' + urlKey(url);
  let starsRow = null;
  if (subject) {
    const rate = document.createElement('button');
    rate.type = 'button';
    rate.className = 'rate focusable';
    rate.textContent = t('rate_cta');
    rate.setAttribute('aria-expanded', 'false');
    rate.setAttribute('aria-controls', 'stars-' + rateId);
    rate.onclick = () => {
      if (openStarsEl === starsRow) { closeStars(); return; }
      closeStars();
      starsRow.classList.add('open');
      rate.setAttribute('aria-expanded', 'true');
      openStarsEl = starsRow;
    };
    head.appendChild(rate);
  }
  el.appendChild(head);

  const m = document.createElement('div');
  m.className = 'm';
  if (type) {
    const tag = document.createElement('span');
    tag.className = 'type';
    tag.textContent = '# ' + typeLabel(type);
    m.appendChild(tag);
  }
  if (isCommunity && pick) {
    const avg = pick.ratings && pick.ratings.length
      ? (pick.ratings.reduce((x,y)=>x+y,0) / pick.ratings.length).toFixed(1) : null;
    if (avg) {
      m.appendChild(starMark());
      m.appendChild(document.createTextNode(' ' + t('ratings')(avg, pick.ratings.length)));
    } else {
      m.appendChild(document.createTextNode(hostOf(url)));
    }
  } else if (builtin && builtin.sampleRatingAvg != null) {
    m.appendChild(starMark());
    m.appendChild(document.createTextNode(' ' + t('ratings')(builtin.sampleRatingAvg.toFixed(1), builtin.sampleRatingCount)));
  } else {
    m.appendChild(document.createTextNode(hostOf(url)));
  }
  el.appendChild(m);

  if (subject) {
    if (isCommunity && pick && BUILTIN.some(b => urlKey(b.url) === urlKey(url))) m.appendChild(twinBadge());
    starsRow = document.createElement('div');
    starsRow.className = 'stars';
    starsRow.id = 'stars-' + rateId;
    starsRow.setAttribute('role', 'group');
    starsRow.setAttribute('aria-label', t('stars_group'));
    const stars = [];
    for (let i = 0; i < 5; i++) {
      const s = document.createElement('button');
      s.type = 'button';
      s.className = 'star focusable';
      s.setAttribute('aria-label', t('star_n')(i + 1));
      s.appendChild(starSvg());
      const preview = n => stars.forEach((st, j) => st.classList.toggle('on', j <= n));
      s.onmouseenter = () => preview(i);
      s.onfocus = () => preview(i);
      s.onclick = () => submitRate(subject, i + 1, starsRow);
      stars.push(s);
      starsRow.appendChild(s);
    }
    starsRow.onmouseleave = () => stars.forEach(st => st.classList.remove('on'));
    el.appendChild(starsRow);
  }
  return el;
}
function closeStars() {
  if (openStarsEl) openStarsEl.classList.remove('open');
  openStarsEl = null;

async function submitRate(subject, score, rowEl) {

    openStarsEl = null;
    setTimeout(async () => { await refresh(); rerenderRanking(); }, 1500);   /* ✓ 停留 1.5s 再刷新，让排序自然归位 */

document.getElementById('fileImport').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let arr;
    try { arr = JSON.parse(reader.result); } catch (err) { ioToast(false, t('import_bad_json')); return; }
    if (!Array.isArray(arr)) { ioToast(false, t('import_bad_fmt')); return; }
    const existing = await Store.load();
    const seenIds = new Set(existing.map(p => p.id));
    const seenUrls = new Set(existing.map(p => urlKey(p.url)));
    const merged = existing.slice();
    let added = 0, skipped = 0;
    for (const raw of arr) {
      const p = coercePick(raw);
      if (!p || seenIds.has(p.id) || seenUrls.has(urlKey(p.url))) { skipped++; continue; }
      seenIds.add(p.id); seenUrls.add(urlKey(p.url));
      merged.push(p); added++;
    }
    try {
      await Store.save(merged);
      ioToast(true, t('import_ok')(added, skipped));
      await refresh();
    } catch (err) {
      ioToast(false, t('import_fail'));
    }
  };
  reader.readAsText(f);
};

function t(k, ...a) {
  const v = (T[lang] && T[lang][k] !== undefined) ? T[lang][k] : T.zh[k];
  if (typeof v !== 'function') return v;
  return a.length ? v(...a) : v;   /* 带插值的词条需显式传参；无参调用返回函数本身 */
}
function set(id, k) { const el = document.getElementById(id); if (el) el.textContent = t(k); }
function applyLang() {

/* ================= 全屏入场：站长手写信逐字打出（手写体） =================
   reduced-motion 直接跳过；每个会话只播一次；点击/按键跳过；总时长有硬上限 */
function buildIntro() {
  const intro = document.createElement('div');
  intro.id = 'intro';
  intro.setAttribute('aria-label', '站长的话');
  const paper = document.createElement('div');
  paper.className = 'intro-paper';
  const txt = document.createElement('div');
  txt.className = 'hand intro-text';
  txt.id = 'introText';
  const sign = document.createElement('div');
  sign.className = 'hand intro-sign';
  sign.id = 'introSign';
  sign.textContent = t('intro_sign');
  const hint = document.createElement('div');
  hint.className = 'intro-hint';
  hint.id = 'introHint';
  hint.textContent = t('intro_hint');
  paper.appendChild(txt); paper.appendChild(sign);
  intro.appendChild(paper); intro.appendChild(hint);
  return intro;
}
function removeStaticIntro() {
  const el = document.getElementById('intro');
  if (el) el.remove();
}
function playIntro() {
  removeStaticIntro();                      /* 先移除 HTML 静态占位层 */
  if (document.getElementById('intro')) return;   /* 已在播放（如重播连点）则不重复 */
  const intro = buildIntro();
  document.body.appendChild(intro);
  document.body.style.overflow = 'hidden';
  const NL = String.fromCharCode(10);
  const full = T[lang].intro_paras.join(NL + NL);
  const target = intro.children[0].children[0];
  const sign = intro.children[0].children[1];
  const hint = intro.children[1];
  let i = 0, timer = null, stage = 'typing';   /* typing →(交互) full 停住 →(再交互) 进入 */
  function updateHint() { hint.textContent = t(stage === 'full' ? 'intro_hint_enter' : 'intro_hint'); }
  function reveal() {
    if (stage !== 'typing') return;
    stage = 'full';
    clearTimeout(timer);
    target.textContent = full;
    target.classList.add('done');
    sign.classList.add('show');
    updateHint();
  }
  function enter() {
    if (stage !== 'full') return;
    stage = 'gone';
    document.removeEventListener('keydown', onkey);
    intro.classList.add('bye');
    setTimeout(() => {
      intro.remove();
      document.body.style.overflow = '';
    }, 850);
    try { sessionStorage.setItem('csc_intro_done', '1'); } catch (e) {}
  }
  function act() { if (stage === 'typing') reveal(); else if (stage === 'full') enter(); }
  function onkey() { act(); }
  function type() {
    if (stage !== 'typing') return;
    i++;
    target.textContent = full.slice(0, i);
    if (i >= full.length) { reveal(); return; }   /* 打完自动停在全文，等待再次确认进入 */
    const pause = '，。！：；、？'.includes(full.charAt(i - 1)) ? 120 : 0;
    timer = setTimeout(type, 24 + pause);
  }
  updateHint();
  timer = setTimeout(type, 500);
  intro.addEventListener('click', act);
  document.addEventListener('keydown', onkey);
  setTimeout(reveal, full.length * 46 + 2600);   /* 兜底：打字异常也至少显示全文（不自动进入） */
}
(function(){
  let reduced = false, seen = false;
  try { reduced = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  try { seen = !!sessionStorage.getItem('csc_intro_done'); } catch (e) { seen = true; }
  if (reduced || seen) removeStaticIntro(); else playIntro();
})();



/* ================= 全屏宽天空：夜=2D 星空画布（参照个人站 alidadei.github.io），昼=CSS 渐变（.sky-day） ================= */
(function(){
  const c = document.getElementById('skyStars');
  if (!c || !c.getContext) return;
  let reduced = false;
  try { reduced = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  const ctx = c.getContext('2d');
  const isSmall = Math.min(window.innerWidth || 900, window.innerHeight || 700) < 768;
  const dpr = Math.min(window.devicePixelRatio || 1, isSmall ? 1.5 : 2);
  let W = 0, H = 0, off = null, last = 0, shootTimer = 4 + Math.random() * 6, shooters = [], twinkles = [];
  const starCols = [[255,240,200],[200,220,255],[255,200,150],[180,200,255],[255,255,230]];
  const medCols = ['200,215,255','255,245,220','180,200,255','255,220,180'];
  let seed = 20260910;
  const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  function init() {
    W = c.clientWidth; H = c.clientHeight;
    if (!W || !H) return;
    c.width = W * dpr; c.height = H * dpr;
    seed = 20260910; twinkles = []; shooters = [];
    off = document.createElement('canvas');
    off.width = W * dpr; off.height = H * dpr;
    const g = off.getContext('2d');
    g.scale(dpr, dpr);
    /* 深空底（调紫不调蓝，与藕荷紫夜同宗） */
    const bg = g.createRadialGradient(W*0.5, H*0.32, 0, W*0.5, H*0.32, Math.max(W,H)*0.85);
    bg.addColorStop(0, '#251c3a'); bg.addColorStop(0.45, '#1c1530'); bg.addColorStop(1, '#120e20');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    /* 银河带（微弱两层） */
    g.save(); g.translate(W*0.42, H*0.34); g.rotate(-0.5);
    for (let l = 0; l < 2; l++) {
      const mg = g.createRadialGradient(0, 0, 0, 0, 0, W*(0.28 + l*0.1));
      const a = 0.06 - l*0.02;
      mg.addColorStop(0, `rgba(155,145,205,${a})`);
      mg.addColorStop(0.5, `rgba(120,115,180,${a*0.5})`);
      mg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = mg; g.fillRect(-W*0.6, -H*(0.05+l*0.03), W*1.2, H*(0.1+l*0.06));
    }
    g.restore();
    /* 星云三团（藕荷紫系） */
    [[0.16,0.3,0.2,[130,95,190],0.055],[0.8,0.24,0.16,[165,120,190],0.05],[0.55,0.68,0.18,[100,105,175],0.04]].forEach(n => {
      g.save(); g.translate(W*n[0], H*n[1]); g.scale(1, 0.55);
      const ng = g.createRadialGradient(0, 0, 0, 0, 0, Math.min(W,H)*n[2]);
      ng.addColorStop(0, `rgba(${n[3][0]},${n[3][1]},${n[3][2]},${n[4]})`);
      ng.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = ng; g.beginPath(); g.arc(0, 0, Math.min(W,H)*n[2], 0, Math.PI*2); g.fill();
      g.restore();
    });
    /* 尘埃星 170 + 小星 70（静态层） */
    for (let i = 0; i < 170; i++) {
      g.fillStyle = `rgba(205,196,235,${0.08 + rand()*0.25})`;
      g.fillRect(rand()*W, rand()*H, 0.2 + rand()*0.5, 0.2 + rand()*0.5);
    }
    for (let i = 0; i < 70; i++) {
      g.fillStyle = `rgba(215,210,245,${0.18 + rand()*0.4})`;
      g.beginPath(); g.arc(rand()*W, rand()*H, 0.4 + rand()*0.9, 0, Math.PI*2); g.fill();
    }
    /* 闪烁星三层：中 18 / 光晕 8 / 十字芒 2 */
    for (let i = 0; i < 18; i++) twinkles.push({ x:rand()*W, y:rand()*H, size:1+rand()*1.1, base:0.35+rand()*0.4, speed:0.8+rand()*1.8, ph:rand()*Math.PI*2, col:medCols[(rand()*medCols.length)|0] });
    for (let i = 0; i < 8; i++) { const cc = starCols[(rand()*starCols.length)|0]; twinkles.push({ x:rand()*W, y:rand()*H, size:1.2+rand()*1.6, base:0.85, speed:0.4+rand()*1.1, ph:rand()*Math.PI*2, col:cc.join(','), glow:true }); }
    for (let i = 0; i < 2; i++) { const cc = starCols[(rand()*starCols.length)|0]; twinkles.push({ x:W*0.08+rand()*W*0.84, y:H*0.08+rand()*H*0.6, size:1.8+rand()*1.8, base:0.9, speed:0.25+rand()*0.5, ph:rand()*Math.PI*2, col:cc.join(','), spikes:true }); }
  }
  function draw(t, dt) {
    if (!off) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(off, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const s of twinkles) {
      const flicker = 0.5 + 0.5 * Math.sin(t * s.speed + s.ph);
      const alpha = s.base * (0.3 + 0.7 * flicker);
      if (s.spikes) {
        const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 8);
        glow.addColorStop(0, `rgba(${s.col},${0.2*flicker})`);
        glow.addColorStop(0.2, `rgba(${s.col},${0.06*flicker})`);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow; ctx.fillRect(s.x - s.size*8, s.y - s.size*8, s.size*16, s.size*16);
        ctx.fillStyle = `rgba(${s.col},${alpha})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = `rgba(${s.col},${0.35*flicker})`; ctx.lineWidth = 0.8;
        const L = s.size * 6;
        ctx.beginPath(); ctx.moveTo(s.x-L, s.y); ctx.lineTo(s.x+L, s.y); ctx.moveTo(s.x, s.y-L); ctx.lineTo(s.x, s.y+L); ctx.stroke();
      } else if (s.glow) {
        const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 5);
        glow.addColorStop(0, `rgba(${s.col},${0.22*flicker})`);
        glow.addColorStop(0.3, `rgba(${s.col},${0.05*flicker})`);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow; ctx.fillRect(s.x - s.size*5, s.y - s.size*5, s.size*10, s.size*10);
        ctx.fillStyle = `rgba(${s.col},${alpha})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = `rgba(${s.col},${alpha})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
      }
    }
    /* 流星：低频温和（7–16s 一颗） */
    shootTimer -= dt;
    if (shootTimer <= 0) {
      shootTimer = 7 + Math.random() * 9;
      const a = 0.3 + Math.random() * 0.5, sp = 240 + Math.random() * 200;
      shooters.push({ x: W*0.1 + Math.random()*W*0.65, y: Math.random()*H*0.35, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, decay: 0.55 + Math.random()*0.3, len: 34 + Math.random()*46 });
    }
    for (let k = shooters.length - 1; k >= 0; k--) {
      const s = shooters[k];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= s.decay * dt;
      if (s.life <= 0) { shooters.splice(k, 1); continue; }
      const tail = Math.min(s.len, s.life * 90);
      const sp = Math.hypot(s.vx, s.vy) || 1;
      const nx = s.x - s.vx / sp * tail, ny = s.y - s.vy / sp * tail;
      const grad = ctx.createLinearGradient(s.x, s.y, nx, ny);
      grad.addColorStop(0, `rgba(220,225,255,${0.7 * s.life})`);
      grad.addColorStop(1, 'rgba(220,225,255,0)');
      ctx.strokeStyle = grad; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(nx, ny); ctx.stroke();
    }
  }
  function frame(time) {
    const dt = Math.min((time - last) / 1000, 0.1);
    last = time;
    if ((window.__dayT || 0) < 0.97) draw(time / 1000, dt);   /* 白天画布已被 CSS 隐藏，跳过绘制省电 */
    requestAnimationFrame(frame);
  }
  function start() {
    init();
    if (reduced) { draw(0, 0); return; }   /* 静态一帧：星空在，不闪不流星 */
    requestAnimationFrame(frame);
  }
  start();
  let rT = null;
  window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { init(); if (reduced) draw(0, 0); }, 200); });
})();

applyLang();
setInterval(() => { if (window.__themeTick) window.__themeTick(); }, 600000);   /* 页面久开：配色随时辰缓移 */
refresh();
