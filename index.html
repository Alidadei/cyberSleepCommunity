<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛博睡眠社区 cyberSleep · 犯困内容收藏馆</title>
<style>
  :root{--bg:#0d0f1a;--card:#151a2c;--line:#2b3152;--ink:#dfe3f5;--sub:#9aa3c7;--gold:#e7c97f;--purple:#4e57a5;--ok:#7fd6a4;--bad:#e07a7a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font:16px/1.8 "Microsoft YaHei",system-ui,sans-serif;padding:32px 14px}
  .wrap{max-width:860px;margin:0 auto}
  header{text-align:center;margin-bottom:24px}
  h1{font-size:26px;color:var(--gold);font-weight:600}
  .sub{color:var(--sub);font-size:14px;margin-top:6px}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:16px;padding:4px 16px;font-size:14px;cursor:pointer;user-select:none}
  .chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
  .card .t{font-size:17px;font-weight:600;cursor:pointer}
  .card .t:hover{color:var(--gold)}
  .card .m{font-size:13px;color:var(--sub);margin-top:4px;word-break:break-all}
  .card .rate{float:right;font-size:13px;color:var(--gold);cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:2px 12px}
  .card .rate:hover{border-color:var(--gold)}
  .type{display:inline-block;font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:10px;padding:0 8px;margin-right:8px}
  .form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:22px 0}
  .form h3{color:var(--gold);font-size:16px;margin-bottom:10px}
  input,select{width:100%;background:#0f1322;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 12px;font-size:14px;margin:6px 0;outline:none}
  input:focus,select:focus{border-color:var(--purple)}
  .btn{background:var(--purple);color:#fff;border:none;border-radius:10px;padding:9px 26px;font-size:15px;cursor:pointer;margin-top:8px}
  .btn:hover{filter:brightness(1.15)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
  .msg{font-size:13px;margin-top:8px;display:none}
  .msg.ok{display:block;color:var(--ok)} .msg.bad{display:block;color:var(--bad)}
  .label{font-size:13px;color:var(--sub)}
  .tools{display:flex;gap:10px;justify-content:center;margin:18px 0}
  .hint{font-size:12px;color:var(--sub);text-align:center;margin-top:6px}
  footer{margin-top:36px;text-align:center;color:var(--sub);font-size:12px;line-height:2}
  footer a{color:#8fb4ff}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>🌙 赛博睡眠社区 cyberSleep</h1>
  <div class="sub">专门收藏让人犯困的内容 · 与「睡眠站台」APP 同源数据 · 怀民亦未寝</div>
</header>

<div class="chips" id="chips"></div>
<div id="list"></div>

<div class="form">
  <h3>推荐一条犯困内容</h3>
  <div class="label">标题</div>
  <input id="fTitle" placeholder="例：雨声助眠 8 小时（留空可自动从链接抓取）">
  <div class="label">链接</div>
  <input id="fUrl" placeholder="https:// …（B站分享文本直接粘贴也行）">
  <div class="label">适合哪类失眠的人（选填）</div>
  <select id="fType">
    <option value="">不确定 / 通用</option>
    <option value="anxiety">焦虑型 · 思绪停不下来</option>
    <option value="excitement">兴奋型 · 大脑过电影</option>
    <option value="physical">生理型 · 浑身不得劲</option>
    <option value="noise">噪音干扰型 · 环境吵</option>
  </select>
  <button class="btn" id="fSubmit">发布推荐</button>
  <div class="msg" id="fMsg"></div>
  <div class="hint">含广告卖货 / 联系方式的内容会被直接拦下（与 APP 同一套 AdGuard 规则）</div>
</div>

<div class="tools">
  <button class="btn ghost" id="btnExport">导出数据 JSON</button>
  <button class="btn ghost" id="btnImport">导入数据 JSON</button>
  <input type="file" id="fileImport" accept=".json" style="display:none">
</div>

<footer>
  数据契约与开发文档见仓库 <a href="docs/DATA_CONTRACT.md">docs/DATA_CONTRACT.md</a> ·
  姊妹应用：<a href="https://github.com/Alidadei/MySleep">睡眠站台 (Android)</a><br>
  当前为 P0 本机存储版 · 接入 Supabase 后两端数据实时互通（见契约 §6）
</footer>

</div>

<script>
/* ================= 数据契约 v1（docs/DATA_CONTRACT.md） =================
 * CommunityPick = { id:number, title:string, url:string, type:string|null,
 *                   ratings:number[], addedAt:number }
 * 网站端与 APP 端（RelaxStore.kt / Gson）字段完全一致，禁止改名。
 * ================================================================ */

const TYPES = [
  {key:'anxiety',    label:'焦虑型'},
  {key:'excitement', label:'兴奋型'},
  {key:'physical',   label:'生理型'},
  {key:'noise',      label:'噪音干扰型'}
];
const KEY = 'csc_community_picks';

/* ---- 内置精选：与 APP assets/relax_picks.json 同步（每型一条样例+示例评分，
   真实用户评分接入后替换 sampleRating 为真实聚合值） ---- */
const BUILTIN = [
  {title:'呼吸放松 4-7-8 · 焦虑平复引导', url:'https://m.bilibili.com/search?keyword=478%E5%91%BC%E5%90%B8%E6%94%BE%E6%9D%BE%E5%8A%A9%E7%9C%A0', type:'anxiety', sample:true, sampleRating:'★ 4.7 · 215 次评价'},
  {title:'世界通史有声书 · 越听越困系列', url:'https://m.bilibili.com/search?keyword=%E4%B8%96%E7%95%8C%E9%80%9A%E5%8F%B2%E6%9C%89%E5%A3%B0%E4%B9%A6', type:'excitement', sample:true, sampleRating:'★ 4.6 · 178 次评价'},
  {title:'渐进式肌肉放松 · 从脚到眉引导', url:'https://m.bilibili.com/search?keyword=%E6%B8%90%E8%BF%9B%E5%BC%8F%E8%82%8C%E8%82%89%E6%94%BE%E6%9D%BE%E5%BC%95%E5%AF%BC', type:'physical', sample:true, sampleRating:'★ 4.8 · 156 次评价'},
  {title:'雨声助眠 8 小时 · 雨打窗台', url:'https://m.bilibili.com/search?keyword=%E9%9B%A8%E5%A3%B0%E5%8A%A9%E7%9C%A08%E5%B0%8F%E6%97%B6', type:'noise', sample:true, sampleRating:'★ 4.9 · 302 次评价'}
];

/* ================= AdGuard（词表来源 docs/adguard-rules.json，与 APP AdGuard.kt 同步） ================= */
const ADGUARD = (() => {
  const strong = ["加微信","加vx","加V","加企鹅","私聊","私信我","联系我","扫码","二维码","优惠券","领券","折扣","低价出","出售","急出","二手转","代购","代下单","下单立减","货到付款","返现","佣金","招商","招代理","兼职","刷单","引流","涨粉","粉丝群","资源群","内部群","免费领","点击购买","立即购买","店铺","旗舰店","微店","拼多多","淘宝下单","京东自营店","带货","卖货","招聘","贷款","借款","办理","低价充值","会员充值","账号出售","外挂"];
  const weak = ["广告","推广","下单","购买","秒杀","限时","福利","补贴","开户","咨询","官网址","平台","一手货源","厂家直销","包赚","稳赚","收益"];
  const contact = [
    /(微信|weixin|wx|vx|v信|v:x|威信|薇信)[号:：\s]*[a-zA-Z0-9_-]{5,}/i,
    /(qq|扣扣|企鹅)[群号:：\s]*\d{4,}/i,
    /1[3-9]\d{9}/,
    /(t\.cn|bit\.ly|dwz\.cn|url\.cn|suo\.im|tinyurl)\/\S+/i
  ];
  function check(text) {
    const s = (text || '').toLowerCase();
    for (const re of contact) { const m = re.exec(s); if (m) return {ok:false, reason:'疑似联系方式/短链：' + m[0].slice(0,24)}; }
    for (const k of strong) if (s.includes(k.toLowerCase())) return {ok:false, reason:'疑似推广关键词：' + k};
    const weakHits = weak.filter(k => s.includes(k.toLowerCase())).length;
    if (weakHits >= 2) return {ok:false, reason:'广告特征过多（命中 ' + weakHits + ' 项）'};
    return {ok:true};
  }
  return {check};
})();

/* ================= Store 抽象：P0=localStorage，P1 换 SupabaseStore ================= */
const Store = {
  load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
  },
  save(picks) {
    localStorage.setItem(KEY, JSON.stringify(picks));
  },
  add(title, url, type) {
    const picks = this.load();
    picks.push({ id: Date.now(), title, url, type: type || null, ratings: [], addedAt: Date.now() });
    this.save(picks);
  },
  rate(id, score) {
    const picks = this.load();
    const p = picks.find(x => x.id === id);
    if (p) { (p.ratings = p.ratings || []).push(score); this.save(picks); }
  }
};
/* P1 占位：实现同接口即可无缝替换
const SupabaseStore = { load: async () => fetch(`${URL}/rest/v1/community_picks`,{headers:{apikey:KEY2}}).then(r=>r.json()), ... }
*/

/* ================= 工具 ================= */
function normalizeUrl(u) {
  u = (u || '').trim();
  return /^(https?:\/\/)/i.test(u) ? u : 'https://' + u;
}
function isValidUrl(u) {
  try { return !!new URL(normalizeUrl(u)).host; } catch (e) { return false; }
}
/* B站分享文本：【标题】 url?params */
function parseShareText(text) {
  const m = (text || '').match(/https?:\/\/\S+/);
  const t = (text || '').match(/【(.+?)】|「(.+?)」/);
  return { url: m && m[0].replace(/[，。）》】,;]+$/,''), title: t && (t[1] || t[2]) };
}
function typeLabel(key) { const t = TYPES.find(x => x.key === key); return t ? t.label : ''; }
function sortPicks(picks) {
  return picks.slice().sort((a,b) => {
    const am = a.ratings && a.ratings.length ? a.ratings.reduce((x,y)=>x+y,0)/a.ratings.length : -1;
    const bm = b.ratings && b.ratings.length ? b.ratings.reduce((x,y)=>x+y,0)/b.ratings.length : -1;
    return bm - am || (b.ratings||[]).length - (a.ratings||[]).length || (b.addedAt||0) - (a.addedAt||0);
  });
}

/* ================= 渲染 ================= */
let currentType = 'all';
function render() {
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  [['all','全部'], ...TYPES.map(t => [t.key, t.label])].forEach(([key, label]) => {
    const c = document.createElement('div');
    c.className = 'chip' + (key === currentType ? ' on' : '');
    c.textContent = label;
    c.onclick = () => { currentType = key; render(); };
    chips.appendChild(c);
  });

  const list = document.getElementById('list');
  list.innerHTML = '';

  const seen = new Set();
  BUILTIN.filter(p => currentType === 'all' || p.type === currentType).forEach(p => {
    seen.add(p.url);
    list.appendChild(card(p.title, p.url, p.type, null, false, p.sample, p.sampleRating));
  });

  const community = sortPicks(Store.load()).filter(p => currentType === 'all' || p.type === currentType);
  community.forEach(p => { seen.add(p.url); list.appendChild(card(p.title, p.url, p.type, p, true)); });

  if (!community.length && currentType !== 'all') {
    const empty = document.createElement('div');
    empty.className = 'hint';
    empty.style.margin = '20px 0';
    empty.textContent = '该类型还没有社区推荐，欢迎发布第一条';
    list.appendChild(empty);
  }
}
function card(title, url, type, pick, isCommunity, sample, sampleRating) {
  const el = document.createElement('div');
  el.className = 'card';
  let meta = '';
  if (type) meta += '<span class="type">' + typeLabel(type) + '</span>';
  el.innerHTML = '<span class="t"></span><div class="m">' + meta + '</div>';
  el.querySelector('.t').textContent = (sample ? '【样例】' : '') + title;
  const m = el.querySelector('.m');
  if (isCommunity && pick) {
    const avg = pick.ratings && pick.ratings.length
      ? (pick.ratings.reduce((a,b)=>a+b,0) / pick.ratings.length).toFixed(1) : null;
    m.insertAdjacentHTML('beforeend', (avg ? '★ ' + avg + ' · ' + pick.ratings.length + ' 次评价' : url));
    const rate = document.createElement('span');
    rate.className = 'rate';
    rate.textContent = '评分 ☆';
    rate.onclick = () => ratePick(pick.id);
    el.appendChild(rate);
  } else {
    m.insertAdjacentHTML('beforeend', '');
    m.appendChild(document.createTextNode(sampleRating || url));
  }
  el.querySelector('.t').onclick = () => window.open(url, '_blank');
  return el;
}
function ratePick(id) {
  const v = prompt('给这条内容的助眠效果打分（1-5，5 = 最有效）：', '5');
  const n = parseInt(v, 10);
  if (n >= 1 && n <= 5) { Store.rate(id, n); render(); }
}

/* ================= 提交 ================= */
document.getElementById('fUrl').addEventListener('input', e => {
  const parsed = parseShareText(e.target.value);
  if (parsed.title && !document.getElementById('fTitle').value.trim()) {
    document.getElementById('fTitle').value = parsed.title;
  }
  if (parsed.url) e.target.value = parsed.url;
});
document.getElementById('fSubmit').onclick = () => {
  const msg = document.getElementById('fMsg');
  msg.className = 'msg';
  const rawUrl = document.getElementById('fUrl').value;
  const parsed = parseShareText(rawUrl);
  const url = normalizeUrl(parsed.url || rawUrl);
  let title = document.getElementById('fTitle').value.trim();
  const type = document.getElementById('fType').value || null;

  if (!isValidUrl(url)) { msg.classList.add('bad'); msg.textContent = '链接无效，请检查'; return; }
  try { if (!title) title = new URL(url).host + ' 的犯困内容'; } catch (e) {}
  const verdict = ADGUARD.check(title + ' ' + url);
  if (!verdict.ok) { msg.classList.add('bad'); msg.textContent = '未发布：' + verdict.reason; return; }

  Store.add(title.slice(0, 80), url, type);
  document.getElementById('fTitle').value = '';
  document.getElementById('fUrl').value = '';
  document.getElementById('fType').value = '';
  msg.classList.add('ok');
  msg.textContent = '已发布 ✓ 感谢为同类型的失眠伙伴添砖加瓦';
  render();
};

/* ================= 导出/导入（P0 迁移通道，契约 §5） ================= */
document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(Store.load(), null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cyberSleep_picks.json';
  a.click();
};
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const arr = JSON.parse(reader.result);
      if (Array.isArray(arr)) { Store.save(arr); render(); alert('导入成功：' + arr.length + ' 条'); }
      else alert('文件格式不对（需要 CommunityPick 数组，见数据契约 §1）');
    } catch (err) { alert('JSON 解析失败'); }
  };
  reader.readAsText(f);
};

render();
</script>
</body>
</html>
